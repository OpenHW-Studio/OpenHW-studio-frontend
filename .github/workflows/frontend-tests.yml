name: Frontend Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/components/**'
      - 'src/pages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/components/**'
      - 'src/pages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'

jobs:
  component-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenHW-studio-frontend

    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4
        with:
          path: OpenHW-studio-frontend

      - name: Checkout emulator code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-emulator
          path: openhw-studio-emulator
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OpenHW-studio-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest component tests
        run: npx vitest run --environment jsdom src/components/**/*.test.jsx

      - name: Reference Platform Validation Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Platform Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "See unified backend+emulator report: https://github.com/OpenHW-Studio/openhw-studio-backend/actions/workflows/platform-validation-summary.yml" >> "$GITHUB_STEP_SUMMARY"

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenHW-studio-frontend

    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4
        with:
          path: OpenHW-studio-frontend

      - name: Checkout emulator code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-emulator
          path: openhw-studio-emulator
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OpenHW-studio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start dev server
        run: npm run dev &
        timeout-minutes: 1

      - name: Wait for dev server
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run Playwright E2E tests
        run: npx playwright test e2e/autofix-preview.spec.js

      - name: Reference Platform Validation Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Platform Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "See unified backend+emulator report: https://github.com/OpenHW-Studio/openhw-studio-backend/actions/workflows/platform-validation-summary.yml" >> "$GITHUB_STEP_SUMMARY"

