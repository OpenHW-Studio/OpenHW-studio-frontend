name: Page Runtime Validation

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/page-validation.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/page-validation.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  pull-requests: write

jobs:
  page-validation:
    name: Validate Page Runtime & Console Errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4
        with:
          path: OpenHW-studio-frontend

      - name: Checkout emulator code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-emulator
          path: openhw-studio-emulator
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OpenHW-studio-frontend/package-lock.json

      - name: Install dependencies
        env:
          NPM_CONFIG_OPTIONAL: "true"
        working-directory: OpenHW-studio-frontend
        run: |
          npm ci --no-audit --no-fund --include=optional
      - name: Cache Native Linux Binaries
        uses: actions/cache@v4
        id: native-bins-cache
        with:
          path: |
            OpenHW-studio-frontend/node_modules/@rollup/rollup-linux-x64-gnu
            OpenHW-studio-frontend/node_modules/lightningcss-linux-x64-gnu
            OpenHW-studio-frontend/node_modules/@tailwindcss/oxide-linux-x64-gnu
          key: native-bins-${{ runner.os }}-${{ hashFiles('.github/workflows/page-validation.yml') }}

      - name: Install native Linux binaries
        if: steps.native-bins-cache.outputs.cache-hit != 'true'
        working-directory: OpenHW-studio-frontend
        run: |
          npm install --no-save --include=optional @rollup/rollup-linux-x64-gnu@4.60.2 lightningcss-linux-x64-gnu@1.31.1 @tailwindcss/oxide-linux-x64-gnu@4.2.1
          node -e "require('@rollup/rollup-linux-x64-gnu'); require('lightningcss-linux-x64-gnu'); require('@tailwindcss/oxide'); console.log('Native binaries OK')"

      - name: Cache Vite build cache
        uses: actions/cache@v4
        with:
          path: OpenHW-studio-frontend/node_modules/.vite
          key: vite-build-${{ runner.os }}-${{ hashFiles('OpenHW-studio-frontend/package-lock.json') }}
          restore-keys: |
            vite-build-${{ runner.os }}-

      - name: Build application
        working-directory: OpenHW-studio-frontend
        run: npm run build

      - name: Create test results directory
        working-directory: OpenHW-studio-frontend
        run: mkdir -p test-results

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('OpenHW-studio-frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: OpenHW-studio-frontend
        run: npx playwright install chromium

      - name: Install Playwright dependencies
        working-directory: OpenHW-studio-frontend
        run: npx playwright install-deps chromium


      - name: Run page validation tests
        working-directory: OpenHW-studio-frontend
        run: |
          # prefer project script if available, otherwise run playwright directly
          npm run test:pages --silent || npx playwright test e2e/page-validation.spec.js --reporter=html,json
        continue-on-error: true

      - name: Run console error check tests
        working-directory: OpenHW-studio-frontend
        run: |
          npm run test:console-errors --silent || npx playwright test e2e/console-error-check.spec.js --reporter=html,json
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-validation-results
          path: |
            OpenHW-studio-frontend/test-results/**
            OpenHW-studio-frontend/test-results
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            OpenHW-studio-frontend/playwright-report/**
            OpenHW-studio-frontend/playwright-report
          retention-days: 30

      - name: Generate test summary
        if: always()
        working-directory: OpenHW-studio-frontend
        run: |
          if [ -f test-results/page-validation/report.json ]; then
            echo "## Page Validation Results" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('test-results/page-validation/report.json', 'utf8'));
              const passed = data.filter(r => r.passed).length;
              const failed = data.length - passed;
              console.log(\`### Summary\`);
              console.log(\`- Total Pages Tested: \${data.length}\`);
              console.log(\`- Passed: \${passed} ✓\`);
              console.log(\`- Failed: \${failed} ✗\`);
              if (failed > 0) {
                console.log(\`### Failed Pages:\`);
                data.filter(r => !r.passed).forEach(r => {
                  console.log(\`- \${r.pageName}\`);
                });
              }
            "
          fi

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- page-validation -->';
            const resultsPath = 'OpenHW-studio-frontend/test-results/page-validation/report.json';
            
            if (fs.existsSync(resultsPath)) {
              const reports = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const passed = reports.filter(r => r.passed).length;
              const failed = reports.length - passed;
              const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
              
              let totalConsoleErrors = 0;
              let totalNetworkErrors = 0;
              let routesWithErrors = 0;
              let issueDetails = [];
              
              let tableRows = '';
              reports.forEach(page => {
                const consoleResult = page.results.find(r => r.test === 'Console Errors');
                const networkResult = page.results.find(r => r.test === 'Network Errors');
                const perfResult = page.results.find(r => r.test === 'Page Performance');
                
                const consoleCount = consoleResult ? (consoleResult.passed ? 0 : parseInt(consoleResult.message)) : 0;
                const networkCount = networkResult ? (networkResult.passed ? 0 : parseInt(networkResult.message)) : 0;
                const loadTime = perfResult ? perfResult.message.match(/\d+ms/)[0] : '-';
                
                totalConsoleErrors += consoleCount;
                totalNetworkErrors += networkCount;
                
                if (!page.passed || consoleCount > 0 || networkCount > 0) {
                  routesWithErrors++;
                  let reasons = [];
                  if (consoleCount > 0) reasons.push(`${consoleCount} Console Error(s) detected`);
                  if (networkCount > 0) reasons.push(`${networkCount} Network Error(s) detected`);
                  if (!page.passed) {
                    const failingChecks = page.results.filter(r => !r.passed && r.test !== 'Console Errors' && r.test !== 'Network Errors');
                    failingChecks.forEach(fc => reasons.push(`${fc.test}: ${fc.message}`));
                  }
                  issueDetails.push(`  - **${page.pageName}**: ${reasons.join(', ')}`);
                }
                
                const statusEmoji = page.passed ? '✅' : '❌';
                const warningEmoji = (consoleCount > 0 || networkCount > 0) ? '⚠️' : '';
                
                tableRows += `| ${page.pageName} | ${statusEmoji} ${warningEmoji} | ${consoleCount} | ${networkCount} | ${loadTime} |\n`;
              });

              const overallEmoji = failed > 0 ? '❌' : (totalConsoleErrors > 0 ? '⚠️' : '✅');
              const overallStatus = failed > 0 ? 'FAILED' : (totalConsoleErrors > 0 ? 'WARNING' : 'PASSED');
              
              let comment = marker + '\n';
              comment += `## ${overallEmoji} Page Runtime Validation Results\n\n`;
              comment += `**Status**: ${overallStatus}\n`;
              comment += `**Runner**: [🔍 View Detailed Logs & Artifacts](${runUrl})\n\n`;
              
              comment += `### 📋 Summary\n`;
              comment += `- **Total Pages Tested**: ${reports.length}\n`;
              comment += `- **✓ Passed**: ${reports.length - routesWithErrors}\n`;
              comment += `- **${overallEmoji} Issues Found**: ${routesWithErrors}\n`;
              if (issueDetails.length > 0) {
                comment += issueDetails.join('\n') + '\n';
              }
              comment += '\n';

              comment += `### 📊 Global Metrics\n`;
              comment += `- **Total Console Errors**: ${totalConsoleErrors} 🛑\n`;
              comment += `- **Total Network Errors**: ${totalNetworkErrors} 🌐\n\n`;
              
              comment += `### 📄 Detailed Page Report\n`;
              comment += `| Page | Status | Console | Network | Perf |\n`;
              comment += `| :--- | :---: | :---: | :---: | :---: |\n`;
              comment += tableRows + '\n';
              
              comment += '\n---\n*Console errors often indicate hidden crashes even if the page appears to load. Please check the logs if you see ⚠️ or ❌.*';

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });

              const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: comment
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }

      - name: Fail job if critical errors found
        if: always()
        working-directory: OpenHW-studio-frontend
        run: |
          if [ -f test-results/page-validation/report.json ]; then
            FAILED=$(node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('test-results/page-validation/report.json', 'utf8'));
              const failed = data.filter(r => !r.passed && r.pageName.includes('critical')).length;
              console.log(failed);
            ")
            if [ "$FAILED" -gt 0 ]; then
              echo "Critical page validation failures detected!"
              exit 1
            fi
          fi

      - name: Reference Platform Validation Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Platform Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "See unified backend+emulator report: https://github.com/OpenHW-Studio/openhw-studio-backend/actions/workflows/platform-validation-summary.yml" >> "$GITHUB_STEP_SUMMARY"

  console-error-report:
    name: Generate Console Error Report
    runs-on: ubuntu-latest
    needs: page-validation
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: page-validation-results

      - name: Generate console error summary
        if: always()
        run: |
          if [ -f console-errors/summary.json ]; then
            echo "## 🔍 Console Error Detection" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('console-errors/summary.json', 'utf8'));
              console.log(\`### Summary\`);
              console.log(\`- Routes Tested: \${data.totalRoutesTested}\`);
              console.log(\`- Routes with Errors: \${data.routesWithErrors}\`);
              console.log(\`- Total Console Errors: \${data.totalConsoleErrors}\`);
              console.log(\`- Total Network Errors: \${data.totalNetworkErrors}\`);
            "
          fi
