name: Notify Admin Dashboard of Changes

on:
  push:
    branches:
      - develop

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Backend
        run: |
          curl -X POST https://openhw-studio.fossee.in/api/deploy/notify \
          -H "Content-Type: application/json" \
          -d '{
            "repo": "${{ github.event.repository.name }}",
            "prTitle": "${{ github.event.head_commit.message }}",
            "prDescription": "Commit pushed by ${{ github.actor }}",
            "secret": "5d2f8e1a9c3b4d7e0f2a5b8d1c4e7f9a",
            "filesChanged": []
          }'
