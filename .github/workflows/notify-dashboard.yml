name: Notify Admin Dashboard of Changes

on:
  push:
    branches:
      - develop

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Backend
        run: |
          curl -X POST https://openhw-studio.fossee.in/api/deploy/notify \
          -H "Content-Type: application/json" \
          -d '{
            "repo": "${{ github.event.repository.name }}",
            "prTitle": "${{ github.event.head_commit.message }}",
            "prDescription": "Commit pushed by ${{ github.actor }}",
            "secret": "${{ secrets.NOTIFY_SECRET }}",
            "filesChanged": []
          }'

      - name: Send Message to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "🚀 <b>Update Successful</b>\n\n📦 <b>Repo:</b> ${{ github.repository }}\n🏷️ <b>Version:</b> ${{ github.sha }}\n👤 <b>Author:</b> ${{ github.actor }}\n💬 <b>Message:</b> ${{ github.event.head_commit.message }}\n🔗 <a href=\"${{ github.event.head_commit.url }}\">View Commit</a>",
            "parse_mode": "HTML"
          }'
