<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHW-Studio</title>
    <link rel="icon" href="/title-logo.png" />
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
      // Register Service Worker for offline app shell booting
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("[SW] Offline Service Worker registered:", reg.scope))
            .catch((err) => console.warn("[SW] Registration failed:", err));
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Wokwi Elements — Served locally for offline support -->
    <script src="/wokwi-elements.bundle.js" defer></script>

  </head>

  <body>
    <div id="root">
      <div
        style="
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #070b14;
          color: #00d4ff;
          font-family: sans-serif;
        "
      >
        <div style="text-align: center">
          <div
            style="
              width: 40px;
              height: 40px;
              border: 3px solid #1e2d47;
              border-top-color: #00d4ff;
              border-radius: 50%;
              animation: openhw-loading-spin 1s linear infinite;
              margin: 0 auto 20px;
            "
          ></div>
          <p style="font-size: 14px; letter-spacing: 0.1em; font-weight: 600">
            OPENHW STUDIO
          </p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
