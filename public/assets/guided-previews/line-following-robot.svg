<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Schematic Banner -->
  <g transform="translate(30, 36)">
    <rect width="120" height="22" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#60A5FA" letter-spacing="1">CIRCUIT SCHEMATIC</text>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Line Following Robot</text>
    <text x="0" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">6 Components Connected · Interactive Virtual Lab</text>
  </g>

  <!-- Wiring Bus -->
  <path d="M 50 145 Q 300 120 550 145" fill="none" stroke="#00D4FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Rendered Component Blocks -->
  
      <g transform="translate(40, 170)">
