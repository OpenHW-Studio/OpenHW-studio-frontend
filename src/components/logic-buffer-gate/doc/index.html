<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Buffer Gate</title>
</head>
<body>
    <h1>Logic Buffer Gate</h1>
    <p>The logic buffer gate is a fundamental digital logic gate that passes its input signal to its output without inversion.</p>
    <h2>Truth Table</h2>
    <table border="1">
        <tr>
            <th>Input (IN)</th>
            <th>Output (OUT)</th>
        </tr>
        <tr>
            <td>0</td>
            <td>0</td>
        </tr>
        <tr>
            <td>1</td>
            <td>1</td>
        </tr>
    </table>
    <h2>Usage</h2>
    <p>Connect a digital signal to the <code>IN</code> pin. The <code>OUT</code> pin will mirror the input signal.</p>
</body>
</html>
